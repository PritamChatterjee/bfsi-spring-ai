spring.application.name=amc-bank-day13-ai
server.port=8080

# PostgreSQL - create this database first:
# CREATE DATABASE amc_bank_customer_login;
spring.datasource.url=jdbc:postgresql://localhost:5432/amc_bank
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: 1 hour. For production, provide JWT_SECRET as an environment variable.
app.jwt.secret=${JWT_SECRET:AMC-Bank-Classroom-JWT-Secret-Key-2026-Change-In-Production}
app.jwt.expiration-ms=3600000


# ------------------------------------------------------------
# DAY 13 - SPRING AI
# ------------------------------------------------------------
# AI is OFF by default so the banking project starts without an API key.
# To enable OpenAI chat, set these environment variables before starting:
#   SPRING_AI_MODEL_CHAT=openai
#   OPENAI_API_KEY=your-key
# Never commit a real API key.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key-not-used-while-ai-disabled}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
